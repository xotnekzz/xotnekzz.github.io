name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # 매일 03:00 UTC — Notion 새 포스트 자동 반영
  workflow_dispatch:        # GitHub UI에서 수동 트리거

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Notion images
        uses: actions/cache@v4
        with:
          path: public/images/notion
          key: notion-images-${{ hashFiles('src/lib/notionToHtml.ts') }}-${{ github.run_id }}
          restore-keys: notion-images-

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
