name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          ADMIN_PASSWORD: test
          ADMIN_SECRET: test
          GITHUB_TOKEN: test
          GITHUB_OWNER: test
          GITHUB_REPO: test
