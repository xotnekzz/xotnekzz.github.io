<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">TO-BE · 처리 대상 키로 연결한 Asset 파이프라인</title><desc id="desc">업스트림 재처리 후 partition key K를 포함한 이벤트를 발행하고, 하위 DAG가 해당 키를 기준으로 연쇄 실행됩니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28253d"/></marker><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#28253d}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600;text-anchor:middle}.sub{font-size:17px;text-anchor:middle}.edge{fill:none;stroke:#28253d;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1080" height="470" fill="#fff"/>
<text x="30" y="45" class="heading">TO-BE · 처리 대상 키로 연결한 Asset 파이프라인</text>
<rect x="30" y="82" width="300" height="250" rx="12" fill="#f9f9fb" stroke="#28253d"/>
<text x="180" y="117" class="label">[1] 업스트림</text>
<rect x="50" y="139" width="260" height="44" rx="8" fill="#fff8e1" stroke="#f9a825"/><text x="180" y="167" class="sub">재처리 시작 · 키 K</text>
<path d="M180 184V210" class="edge"/>
<rect x="50" y="215" width="260" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0"/><text x="180" y="248" class="label">DAG A</text><text x="180" y="281" class="sub">키 K의 데이터 처리</text>
<path d="M331 258H388" class="edge"/><text x="360" y="232" class="sub">K</text>
<rect x="390" y="82" width="300" height="250" rx="12" fill="#f9f9fb" stroke="#28253d"/>
<text x="540" y="117" class="label">[2] 다운스트림</text>
<rect x="410" y="139" width="260" height="44" rx="8" fill="#fff8e1" stroke="#f9a825"/><text x="540" y="167" class="sub">Asset 이벤트 · 키 K</text>
<path d="M540 184V210" class="edge"/>
<rect x="410" y="215" width="260" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0"/><text x="540" y="248" class="label">DAG B</text><text x="540" y="281" class="sub">키 K의 데이터 처리</text>
<path d="M691 258H748" class="edge"/><text x="720" y="232" class="sub">K</text>
<rect x="750" y="82" width="300" height="250" rx="12" fill="#f9f9fb" stroke="#28253d"/>
<text x="900" y="117" class="label">[3] 후속 다운스트림</text>
<rect x="770" y="139" width="260" height="44" rx="8" fill="#fff8e1" stroke="#f9a825"/><text x="900" y="167" class="sub">Asset 이벤트 · 키 K</text>
<path d="M900 184V210" class="edge"/>
<rect x="770" y="215" width="260" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0"/><text x="900" y="248" class="label">DAG C</text><text x="900" y="281" class="sub">키 K의 데이터 처리</text>
<rect x="30" y="358" width="1020" height="87" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="540" y="390" class="label">복구 시작점을 재실행 → 키 K 전달 → 의존 조건 충족 시 하위 DAG 연쇄 실행</text>
<text x="540" y="421" class="sub">키는 처리 범위를 식별 · 동일 키의 반복 처리 결과는 적재 로직에서 보장</text>
</svg>