<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="'Segoe UI', Arial, sans-serif">
<defs>
  <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#d85a30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="900" height="320" fill="#f8f7f4"/>
<text x="450" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a18">StarRocks → Doris 이관 로드맵</text>
<text x="450" y="54" text-anchor="middle" font-size="11" fill="#5f5e5a">마케팅 사일로 해소 — 3단계 점진적 이관</text>

<!-- 1단계 -->
<rect x="30" y="72" width="248" height="216" rx="10" fill="#fff" stroke="#d85a30" stroke-width="1.5"/>
<rect x="30" y="72" width="248" height="36" rx="10" fill="#fdf0ec" stroke="#d85a30" stroke-width="1.5"/>
<rect x="30" y="96" width="248" height="12" rx="0" fill="#fdf0ec" stroke="none"/>
<text x="154" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#993c1d">1단계 — 즉시 적용</text>
<rect x="46" y="118" width="216" height="26" rx="5" fill="#fdf0ec" stroke="#d85a30" stroke-width="1"/>
<text x="154" y="136" text-anchor="middle" font-size="10" font-weight="600" fill="#d85a30">External Catalog 마운트</text>
<text x="154" y="164" text-anchor="middle" font-size="10" fill="#5f5e5a">Doris에서 StarRocks를</text>
<text x="154" y="180" text-anchor="middle" font-size="10" fill="#5f5e5a">외부 카탈로그로 연결</text>
<text x="154" y="200" text-anchor="middle" font-size="10" fill="#5f5e5a">크로스 쿼리 즉시 가능</text>
<text x="154" y="224" text-anchor="middle" font-size="10" fill="#b4b2a9">성능은 네이티브 대비 임시 수준</text>
<text x="154" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#993c1d">AVX2 전환 완료 전 브릿지</text>

<!-- 화살표 1→2 -->
<line x1="278" y1="180" x2="322" y2="180" stroke="#d85a30" stroke-width="2" marker-end="url(#ao)"/>

<!-- 2단계 -->
<rect x="326" y="72" width="248" height="216" rx="10" fill="#fff" stroke="#d85a30" stroke-width="1.5"/>
<rect x="326" y="72" width="248" height="36" rx="10" fill="#fdf0ec" stroke="#d85a30" stroke-width="1.5"/>
<rect x="326" y="96" width="248" height="12" rx="0" fill="#fdf0ec" stroke="none"/>
<text x="450" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#993c1d">2단계 — AVX2 전환 후</text>
<rect x="342" y="118" width="216" height="26" rx="5" fill="#fdf0ec" stroke="#d85a30" stroke-width="1"/>
<text x="450" y="136" text-anchor="middle" font-size="10" font-weight="600" fill="#d85a30">물리 이관</text>
<text x="450" y="164" text-anchor="middle" font-size="10" fill="#5f5e5a">INSERT INTO SELECT로</text>
<text x="450" y="180" text-anchor="middle" font-size="10" fill="#5f5e5a">Doris Bronze 레이어 복사</text>
<text x="450" y="196" text-anchor="middle" font-size="10" fill="#5f5e5a">Airflow 증분 동기화</text>
<text x="450" y="212" text-anchor="middle" font-size="10" fill="#5f5e5a">정합성 검증 후 Catalog 해제</text>
<text x="450" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#993c1d">StarRocks 공식 퇴역</text>

<!-- 화살표 2→3 -->
<line x1="574" y1="180" x2="618" y2="180" stroke="#d85a30" stroke-width="2" marker-end="url(#ao)"/>

<!-- 3단계 -->
<rect x="622" y="72" width="248" height="216" rx="10" fill="#fff" stroke="#d85a30" stroke-width="1.5"/>
<rect x="622" y="72" width="248" height="36" rx="10" fill="#fdf0ec" stroke="#d85a30" stroke-width="1.5"/>
<rect x="622" y="96" width="248" height="12" rx="0" fill="#fdf0ec" stroke="none"/>
<text x="746" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#993c1d">3단계 — 이관 완료 후</text>
<rect x="638" y="118" width="216" height="26" rx="5" fill="#fdf0ec" stroke="#d85a30" stroke-width="1"/>
<text x="746" y="136" text-anchor="middle" font-size="10" font-weight="600" fill="#d85a30">장비 흡수 · 용량 확장</text>
<text x="746" y="164" text-anchor="middle" font-size="10" fill="#5f5e5a">StarRocks 퇴역 장비를</text>
<text x="746" y="180" text-anchor="middle" font-size="10" fill="#5f5e5a">Doris BE 노드로 편입</text>
<text x="746" y="196" text-anchor="middle" font-size="10" fill="#5f5e5a">자동 리밸런싱</text>
<text x="746" y="212" text-anchor="middle" font-size="10" fill="#5f5e5a">OpenMetadata 도메인 등록</text>
<text x="746" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#1d9e75">Gold 크로스 마트 정식 운영</text>
</svg>
