<text x="48" y="93" fill="#64748B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" text-anchor="start"><tspan x="48" dy="0">Observed examples and domain-based inferences · proposed marts are not confirmed deployments</tspan></text>
