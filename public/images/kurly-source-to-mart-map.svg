<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Kurly Source Databases to Business Data and Proposed Marts</title>
<desc id="desc">Five rows map Kurly source database technologies to confirmed or inferred business data and proposed analytical marts. The 2026 DocumentDB service example is not proven to be the same collection as the earlier CDC pipeline.</desc>
