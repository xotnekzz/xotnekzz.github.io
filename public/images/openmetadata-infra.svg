<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata 인프라와 Semantic Search 구조</title>
  <desc id="desc">데이터 소스와 운영 Airflow의 메타데이터를 전용 Ingestion Airflow 및 OpenLineage로 수집하고, OpenMetadata Server가 MariaDB와 OpenSearch를 사용해 사용자와 AI의 데이터 자산 검색을 지원하는 구조</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000" flood-opacity="0.06"/></filter>
    <marker id="arrow" viewBox="0 0 12 14" refX="10" refY="7" markerWidth="11" markerHeight="13" orient="auto"><path d="M0 0L12 7L0 14Z" fill="#333"/></marker>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #28253d; }
      .layer { fill: #f9f9fb; stroke: #28253d; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .layer-title { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .node { fill: #fff; stroke: #28253d; stroke-width: 2; rx: 8; filter: url(#shadow); }
      .process { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 8; filter: url(#shadow); }
      .storage { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; filter: url(#shadow); }
      .search { fill: #fff3e0; stroke: #e65100; stroke-width: 2; filter: url(#shadow); }
      .future { fill: #fff8e1; stroke: #9a6700; stroke-width: 2; rx: 8; filter: url(#shadow); }
      .label { font-size: 17px; font-weight: 650; text-anchor: middle; }
      .sub { font-size: 14px; font-weight: 450; text-anchor: middle; fill: #4b4b5e; }
      .edge { fill: none; stroke: #333; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
      .edge-label { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .note { font-size: 15px; font-weight: 550; }
      .blue { fill: #1565c0; } .green { fill: #2e7d32; } .orange { fill: #e65100; } .amber { fill: #9a6700; }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>

  <rect class="layer" x="24" y="42" width="278" height="610"/>
  <text class="layer-title" x="163" y="78">[1] 메타데이터 원천</text>
  <rect class="layer" x="326" y="42" width="300" height="610"/>
  <text class="layer-title" x="476" y="78">[2] 수집 계층</text>
  <rect class="layer" x="650" y="42" width="582" height="610"/>
  <text class="layer-title" x="941" y="78">[3] OpenMetadata 플랫폼</text>
  <rect class="layer" x="1256" y="42" width="320" height="610"/>
  <text class="layer-title" x="1416" y="78">[4] 탐색 및 AI 활용</text>

  <g>
    <path class="storage" d="M67 145C67 124 257 124 257 145V225C257 246 67 246 67 225Z"/>
    <ellipse class="storage" cx="162" cy="145" rx="95" ry="20"/>
    <text class="label green" x="162" y="180">사내 데이터베이스</text>
    <text class="sub" x="162" y="205">스키마 · 테이블 · 설명</text>
  </g>
  <rect class="process" x="67" y="322" width="190" height="102"/>
  <text class="label blue" x="162" y="358">운영 Airflow 3</text>
  <text class="sub" x="162" y="383">DAG · Task 실행 정보</text>
  <text class="sub" x="162" y="405">OpenLineage 이벤트</text>

  <rect class="process" x="366" y="133" width="220" height="112"/>
  <text class="label blue" x="476" y="170">Ingestion Airflow</text>
  <text class="sub" x="476" y="196">OpenMetadata 전용</text>
  <text class="sub" x="476" y="219">수집 Workflow 격리 운영</text>
  <rect class="process" x="366" y="322" width="220" height="102"/>
  <text class="label blue" x="476" y="358">om_lineage</text>
  <text class="sub" x="476" y="383">운영 Airflow 내 적용</text>
  <text class="sub" x="476" y="405">OpenLineage 표준 전달</text>

  <rect class="node" x="702" y="250" width="244" height="126"/>
  <text class="label" x="824" y="288">OpenMetadata Server</text>
  <text class="sub" x="824" y="316">Catalog · Lineage · Ownership</text>
  <text class="sub" x="824" y="340">Glossary · Quality · API</text>

  <g>
    <path class="storage" d="M1000 121C1000 101 1184 101 1184 121V207C1184 227 1000 227 1000 207Z"/>
    <ellipse class="storage" cx="1092" cy="121" rx="92" ry="19"/>
    <text class="label green" x="1092" y="158">MariaDB</text>
    <text class="sub" x="1092" y="182">OpenMetadata DB</text>
    <text class="sub" x="1092" y="203">운영 메타데이터</text>
  </g>
  <g>
    <path class="search" d="M982 421C982 399 1202 399 1202 421V536C1202 558 982 558 982 536Z"/>
    <ellipse class="search" cx="1092" cy="421" rx="110" ry="21"/>
    <text class="label orange" x="1092" y="462">OpenSearch</text>
    <text class="sub" x="1092" y="489">BM25 키워드 인덱스</text>
    <text class="sub" x="1092" y="513">임베딩 벡터 인덱스</text>
    <text class="sub" x="1092" y="537">Semantic Search</text>
  </g>

  <rect class="node" x="1306" y="135" width="220" height="94"/>
  <text class="label" x="1416" y="173">데이터 사용자</text>
  <text class="sub" x="1416" y="198">검색 · 계보 · 신뢰도 확인</text>
  <rect class="future" x="1306" y="322" width="220" height="118"/>
  <text class="label amber" x="1416" y="359">AI Agent</text>
  <text class="sub" x="1416" y="385">MCP · API</text>
  <text class="sub" x="1416" y="410">자연어 요청으로</text>
  <text class="sub" x="1416" y="431">후보 데이터 자산 식별</text>

  <path class="edge" d="M257 185H358"/>
  <text class="edge-label" x="310" y="173">기술 메타데이터</text>
  <path class="edge" d="M586 189H650V280H694"/>
  <text class="edge-label" x="626" y="177">Ingestion API</text>
  <path class="edge" d="M257 373H358"/>
  <path class="edge" d="M586 373H694"/>
  <text class="edge-label" x="640" y="359">Lineage Event</text>
  <path class="edge" d="M946 291H964V173H992"/>
  <path class="edge" d="M1000 195H972V331H946"/>
  <text class="edge-label" x="969" y="157">Read / Write</text>
  <path class="edge" d="M946 335H964V478H974"/>
  <path class="edge" d="M982 505H964V359H946"/>
  <text class="edge-label" x="935" y="448">색인 · 검색</text>
  <path class="edge" d="M1306 182H1232V291H954"/>
  <text class="edge-label" x="1266" y="170">Web UI</text>
  <path class="edge dash" d="M1306 381H1232V349H954"/>
  <text class="edge-label" x="1262" y="368">자연어 질의</text>

  <rect class="future" x="366" y="548" width="836" height="66"/>
  <text class="note amber" x="392" y="577">설계 의도</text>
  <text class="note" x="480" y="577">운영 파이프라인과 메타데이터 수집을 격리하고, 키워드와 의미 기반 검색을 결합해</text>
  <text class="note" x="480" y="601">사람과 AI가 같은 데이터 자산 문맥을 사용하도록 구성</text>
</svg>
