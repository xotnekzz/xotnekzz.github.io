<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">SeaweedFS nginx 로그를 로컬 DuckDB에서 분석하는 흐름</title>
  <desc id="desc">분석 요청 후 AI 에이전트 스킬이 SeaweedFS에서 gzip 로그를 내려받아 검증하고, 로컬 DuckDB에 적재한 다음 서비스 종료 판단 보고서를 생성하는 순서를 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
    <style>
      .bg { fill: #ffffff; } .header { fill: #eef5ff; stroke: #1565c0; stroke-width: 2; }
      .header-green { fill: #eef8f0; stroke: #2e7d32; stroke-width: 2; }
      .text { fill: #28253d; font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif; }
      .title { font-size: 27px; font-weight: 700; } .label { font-size: 18px; font-weight: 700; }
      .note { font-size: 15px; } .line { stroke: #b8c4d5; stroke-width: 2; stroke-dasharray: 7 7; }
      .request { stroke: #1565c0; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .response { stroke: #2e7d32; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; marker-end: url(#return-arrow); }
      .step { fill: #ffffff; stroke: #d7e0eb; stroke-width: 1.5; } .steptext { font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="780" rx="18"/>
  <text class="text title" x="60" y="54">SeaweedFS nginx 로그를 DuckDB로 분석하는 흐름</text>
  <text class="text note" x="60" y="82">별도 로그 분석 인프라 없이, 원본 검증과 종료 판단 근거를 하나의 로컬 작업으로 남긴다.</text>

  <g>
    <rect class="header" x="62" y="112" width="190" height="60" rx="13"/><text class="text label" x="157" y="148" text-anchor="middle">사용자</text>
    <rect class="header" x="332" y="112" width="225" height="60" rx="13"/><text class="text label" x="445" y="148" text-anchor="middle">AI 분석 스킬</text>
    <rect class="header" x="635" y="112" width="225" height="60" rx="13"/><text class="text label" x="748" y="148" text-anchor="middle">SeaweedFS API</text>
    <rect class="header-green" x="942" y="112" width="205" height="60" rx="13"/><text class="text label" x="1045" y="148" text-anchor="middle">로컬 DuckDB</text>
  </g>
  <line class="line" x1="157" y1="172" x2="157" y2="732"/><line class="line" x1="445" y1="172" x2="445" y2="732"/><line class="line" x1="748" y1="172" x2="748" y2="732"/><line class="line" x1="1045" y1="172" x2="1045" y2="732"/>

  <path class="request" d="M157 218 H445"/><rect class="step" x="208" y="190" width="185" height="24" rx="7"/><text class="text steptext" x="300" y="208" text-anchor="middle">1. 월·host 지정</text>
  <path class="request" d="M445 294 H748"/><rect class="step" x="487" y="266" width="220" height="24" rx="7"/><text class="text steptext" x="597" y="284" text-anchor="middle">2. 시간별 gzip 다운로드</text>
  <path class="response" d="M748 348 H445"/><rect class="step" x="495" y="320" width="205" height="24" rx="7"/><text class="text steptext" x="597" y="338" text-anchor="middle">3. 파일 응답 (read-only)</text>
  <path class="request" d="M445 428 H1045"/><rect class="step" x="600" y="400" width="290" height="24" rx="7"/><text class="text steptext" x="745" y="418" text-anchor="middle">4. gzip 검증·timestamp 필터·적재</text>
  <path class="response" d="M1045 510 H445"/><rect class="step" x="616" y="482" width="258" height="24" rx="7"/><text class="text steptext" x="745" y="500" text-anchor="middle">5. endpoint·상태·UA 집계</text>
  <path class="request" d="M445 592 H1045"/><rect class="step" x="614" y="564" width="263" height="24" rx="7"/><text class="text steptext" x="745" y="582" text-anchor="middle">6. 보고서·manifest·DB 생성</text>
  <path class="response" d="M445 670 H157"/><rect class="step" x="217" y="642" width="168" height="24" rx="7"/><text class="text steptext" x="301" y="660" text-anchor="middle">7. 종료 판단 검토</text>

  <text class="text note" x="1045" y="720" text-anchor="middle">nginx_logs.duckdb · manifest · report</text>
</svg>
