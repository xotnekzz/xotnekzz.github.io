<text x="57" y="329" font-size="17" fill="#258264" font-weight="700">실제 데이터 경로</text>
<rect x="65" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="82" y="200" font-size="21" fill="#13243a" font-weight="700">SQL 클라이언트</text><text x="82" y="232" font-size="16" fill="#45566c" font-weight="400">MySQL 프로토콜</text>
<rect x="370" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="387" y="200" font-size="21" fill="#13243a" font-weight="700">FE</text><text x="387" y="232" font-size="16" fill="#45566c" font-weight="400">파싱·최적화·메타데이터</text>
<rect x="675" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="692" y="200" font-size="21" fill="#13243a" font-weight="700">FE 리더/팔로어</text><text x="692" y="232" font-size="16" fill="#45566c" font-weight="400">메타데이터 고가용성</text>
<rect x="980" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="997" y="200" font-size="21" fill="#13243a" font-weight="700">트랜잭션</text><text x="997" y="232" font-size="16" fill="#45566c" font-weight="400">적재 가시성 관리</text>
<rect x="65" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="82" y="380" font-size="21" fill="#13243a" font-weight="700">원천 데이터</text><text x="82" y="412" font-size="16" fill="#45566c" font-weight="400">파일·스트림·SQL</text>
<rect x="370" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="387" y="380" font-size="21" fill="#13243a" font-weight="700">BE 적재</text><text x="387" y="412" font-size="16" fill="#45566c" font-weight="400">분산 데이터 쓰기</text>
<rect x="675" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="692" y="380" font-size="21" fill="#13243a" font-weight="700">BE 클러스터</text><text x="692" y="412" font-size="16" fill="#45566c" font-weight="400">샤드 저장·MPP 실행</text>
