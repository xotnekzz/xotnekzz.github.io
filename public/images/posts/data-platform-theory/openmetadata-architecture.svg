<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc" font-family="Arial, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<title id="title">OpenMetadata 메타데이터 수집과 활용 아키텍처</title>
<desc id="desc">외부 데이터 서비스에서 Connector Workflow와 OpenLineage가 메타데이터를 OpenMetadata API로 전달합니다. API는 메타데이터 DB에 저장하고 검색 엔진 색인을 갱신하며 UI와 클라이언트는 API와 검색 엔진을 통해 자산을 탐색합니다.</desc>
<defs>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#278568"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5271b8"/></marker>
</defs>
<rect width="1440" height="820" rx="24" fill="#f8fafc"/>
<text x="48" y="58" font-size="32" fill="#13243a" font-weight="700">OpenMetadata · 메타데이터를 모으고 연결하는 플랫폼</text>
<text x="49" y="91" font-size="18" fill="#52647a">초록색: 메타데이터 수집·전달    파란색: API·검색·서비스 경로    원천 데이터 바이트는 이동하지 않습니다.</text>

