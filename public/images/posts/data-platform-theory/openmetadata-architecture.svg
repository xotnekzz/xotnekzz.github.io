<text x="62" y="526" font-size="15" fill="#45566c">Connector는 카탈로그·쿼리 로그·</text><text x="62" y="550" font-size="15" fill="#45566c">산출물에서 설명 정보를 읽습니다.</text>
<text x="62" y="605" font-size="15" fill="#45566c" font-weight="700">테이블 행과 파일 내용은</text><text x="62" y="630" font-size="15" fill="#45566c" font-weight="700">OpenMetadata로 복사하지 않습니다.</text>

