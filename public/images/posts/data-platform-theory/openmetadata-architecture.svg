<text x="81" y="226" font-size="20" fill="#13243a" font-weight="700">데이터 저장소</text><text x="81" y="252" font-size="16" fill="#45566c">Doris · BigQuery · S3</text>
<rect x="62" y="297" width="238" height="80" rx="14" fill="#e1f6ee" stroke="#278568" stroke-width="2"/>
<text x="81" y="330" font-size="20" fill="#13243a" font-weight="700">파이프라인·BI</text><text x="81" y="356" font-size="16" fill="#45566c">Airflow · dbt · 대시보드</text>
<rect x="62" y="401" width="238" height="80" rx="14" fill="#e1f6ee" stroke="#278568" stroke-width="2"/>
