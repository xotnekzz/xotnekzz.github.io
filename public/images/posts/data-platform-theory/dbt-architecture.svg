<rect x="370" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="387" y="200" font-size="21" fill="#13243a" font-weight="700">Parser</text><text x="387" y="232" font-size="16" fill="#45566c" font-weight="400">ref·source 의존성</text>
