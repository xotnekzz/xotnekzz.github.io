<rect x="65" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="82" y="200" font-size="21" fill="#13243a" font-weight="700">호스트 프로세스</text><text x="82" y="232" font-size="16" fill="#45566c" font-weight="400">Python·CLI·애플리케이션</text>
<rect x="370" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="387" y="200" font-size="21" fill="#13243a" font-weight="700">SQL Parser</text><text x="387" y="232" font-size="16" fill="#45566c" font-weight="400">구문·바인딩</text>
<rect x="675" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="692" y="200" font-size="21" fill="#13243a" font-weight="700">Optimizer</text><text x="692" y="232" font-size="16" fill="#45566c" font-weight="400">논리 계획 최적화</text>
<rect x="980" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="997" y="200" font-size="21" fill="#13243a" font-weight="700">Physical Plan</text><text x="997" y="232" font-size="16" fill="#45566c" font-weight="400">실행 연산자 선택</text>
