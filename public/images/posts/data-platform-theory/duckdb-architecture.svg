<text x="91" y="571" font-size="18" fill="#26384b" font-weight="400">바인딩·최적화 후 물리 계획 생성</text>
<circle cx="64" cy="601" r="13" fill="#278568"/>
<text x="59" y="607" font-size="15" fill="#ffffff" font-weight="700">3</text>
<text x="91" y="607" font-size="18" fill="#26384b" font-weight="400">DataChunk를 연산자에 전달</text>
