<text x="57" y="329" font-size="17" fill="#258264" font-weight="700">실제 데이터 경로</text>
<rect x="65" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="82" y="200" font-size="21" fill="#13243a" font-weight="700">DMS API</text><text x="82" y="232" font-size="16" fill="#45566c" font-weight="400">마이그레이션 관리</text>
<rect x="370" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="387" y="200" font-size="21" fill="#13243a" font-weight="700">Replication Task</text><text x="387" y="232" font-size="16" fill="#45566c" font-weight="400">테이블·이동 방식</text>
<rect x="675" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="692" y="200" font-size="21" fill="#13243a" font-weight="700">Source Endpoint</text><text x="692" y="232" font-size="16" fill="#45566c" font-weight="400">접속·로그 설정</text>
<rect x="980" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="997" y="200" font-size="21" fill="#13243a" font-weight="700">Target Endpoint</text><text x="997" y="232" font-size="16" fill="#45566c" font-weight="400">접속·적재 규칙</text>
<rect x="65" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="82" y="380" font-size="21" fill="#13243a" font-weight="700">Source Database</text><text x="82" y="412" font-size="16" fill="#45566c" font-weight="400">스냅샷·변경 로그</text>
<rect x="370" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="387" y="380" font-size="21" fill="#13243a" font-weight="700">Replication Instance</text><text x="387" y="412" font-size="16" fill="#45566c" font-weight="400">읽기·변환·버퍼</text>
<rect x="675" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="692" y="380" font-size="21" fill="#13243a" font-weight="700">Apply Changes</text><text x="692" y="412" font-size="16" fill="#45566c" font-weight="400">Full load 후 CDC 반영</text>
<rect x="980" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="997" y="380" font-size="21" fill="#13243a" font-weight="700">Target Database</text><text x="997" y="412" font-size="16" fill="#45566c" font-weight="400">초기 데이터·변경분</text>
