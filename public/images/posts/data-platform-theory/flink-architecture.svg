<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc" font-family="Arial, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<title id="title">Apache Flink · 상태 기반 데이터 흐름 아키텍처</title>
<desc id="desc">제어·메타데이터 계층과 데이터 처리 계층을 구분합니다. 처리 순서: JobGraph를 Task Slot에 배치; 이벤트가 연산자 체인을 통과; 상태와 입력 위치를 체크포인트; 장애 시 일관된 지점부터 복구</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#278568"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5271b8"/></marker></defs>
<rect width="1280" height="690" rx="24" fill="#f8fafc"/>
<text x="46" y="57" font-size="32" fill="#13243a" font-weight="700">Apache Flink · 상태 기반 데이터 흐름</text>
<text x="47" y="89" font-size="17" fill="#52647a" font-weight="400">파란색: 제어·메타데이터    초록색: 실제 데이터 경로</text>
<rect x="40" y="120" width="1200" height="150" rx="18" fill="#f1f5fc"/>
<rect x="40" y="300" width="1200" height="150" rx="18" fill="#eef8f4"/>
<text x="57" y="149" font-size="17" fill="#5271b8" font-weight="700">제어 · 메타데이터</text>
<text x="57" y="329" font-size="17" fill="#258264" font-weight="700">실제 데이터 경로</text>
<rect x="65" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="82" y="200" font-size="21" fill="#13243a" font-weight="700">Client</text><text x="82" y="232" font-size="16" fill="#45566c" font-weight="400">JobGraph 제출</text>
<rect x="370" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="387" y="200" font-size="21" fill="#13243a" font-weight="700">Dispatcher</text><text x="387" y="232" font-size="16" fill="#45566c" font-weight="400">JobMaster 생성</text>
<rect x="675" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="692" y="200" font-size="21" fill="#13243a" font-weight="700">JobMaster</text><text x="692" y="232" font-size="16" fill="#45566c" font-weight="400">스케줄·체크포인트</text>
<rect x="980" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="997" y="200" font-size="21" fill="#13243a" font-weight="700">ResourceManager</text><text x="997" y="232" font-size="16" fill="#45566c" font-weight="400">Task Slot 할당</text>
<rect x="65" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="82" y="380" font-size="21" fill="#13243a" font-weight="700">Source</text><text x="82" y="412" font-size="16" fill="#45566c" font-weight="400">이벤트·오프셋</text>
<rect x="370" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="387" y="380" font-size="21" fill="#13243a" font-weight="700">TaskManager</text><text x="387" y="412" font-size="16" fill="#45566c" font-weight="400">연산자·네트워크 버퍼</text>
<rect x="675" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="692" y="380" font-size="21" fill="#13243a" font-weight="700">State</text><text x="692" y="412" font-size="16" fill="#45566c" font-weight="400">키별 상태·윈도</text>
<rect x="980" y="346" width="265" height="91" rx="15" fill="#e1f6ee" stroke="#258264" stroke-width="2"/><text x="997" y="380" font-size="21" fill="#13243a" font-weight="700">Sink</text><text x="997" y="412" font-size="16" fill="#45566c" font-weight="400">외부 시스템 기록</text>
