<rect x="307" y="470" width="200" height="85" rx="15" fill="#e3f5ee" stroke="#278568" stroke-width="2"/><text x="322" y="504" font-size="19" fill="#13243a" font-weight="700">PyAirbyte</text><text x="322" y="532" font-size="15" fill="#45566c">YAML manifest</text>
