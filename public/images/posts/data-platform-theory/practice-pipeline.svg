<rect x="980" y="166" width="235" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="997" y="200" font-size="19" fill="#13243a" font-weight="700">OpenMetadata</text><text x="997" y="232" font-size="16" fill="#45566c">계보 · DQ 결과</text>
