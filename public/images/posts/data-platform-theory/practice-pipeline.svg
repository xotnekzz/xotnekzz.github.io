<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc" font-family="Arial, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<title id="title">사내 데이터 플랫폼의 실제 파이프라인</title>
<desc id="desc">위쪽은 Airflow DAG가 Asset 이벤트로 이어지는 제어 경로, 아래쪽은 실제 데이터 경로입니다. Nginx 로그는 SeaweedFS Filer, DuckDB 기반 fastlog-etl, SeaweedFS S3 Parquet을 거쳐 Doris에 Broker Load 됩니다. 광고·스토어 API는 PyAirbyte로 추출해 Doris에 Stream Load 됩니다. dbt Core는 Doris에 SQL을 제출해 Silver와 Gold 마트를 만듭니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#278568"/></marker><marker id="ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5271b8"/></marker></defs>
<rect width="1280" height="750" rx="24" fill="#f8fafc"/>
<text x="46" y="57" font-size="32" fill="#13243a" font-weight="700">사내 데이터 플랫폼 — 실제 파이프라인</text>
<text x="47" y="89" font-size="17" fill="#52647a">파란 점선: Asset 이벤트·메타데이터</text><text x="340" y="89" font-size="17" fill="#52647a">초록색: 실제 데이터 경로</text>
<rect x="40" y="120" width="1200" height="150" rx="18" fill="#f1f5fc"/>
<rect x="40" y="300" width="1200" height="420" rx="18" fill="#eef8f4"/>
<text x="57" y="149" font-size="17" fill="#5271b8" font-weight="700">제어 · Airflow Asset 체인</text>
<text x="57" y="329" font-size="17" fill="#258264" font-weight="700">실제 데이터 경로</text>

<rect x="65" y="166" width="265" height="91" rx="15" fill="#e8efff" stroke="#5271b8" stroke-width="2"/><text x="82" y="200" font-size="19" fill="#13243a" font-weight="700">fastlog_hourly_etl</text><text x="82" y="232" font-size="16" fill="#45566c">매시 25분 · 파일 센서</text>
