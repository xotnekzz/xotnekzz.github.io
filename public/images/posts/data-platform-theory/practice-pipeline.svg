<rect x="791" y="607" width="200" height="85" rx="15" fill="#e3f5ee" stroke="#278568" stroke-width="2"/><text x="806" y="641" font-size="19" fill="#13243a" font-weight="700">Silver</text><text x="806" y="669" font-size="15" fill="#45566c">정제 · 표준화</text>
<rect x="1033" y="607" width="200" height="85" rx="15" fill="#e3f5ee" stroke="#278568" stroke-width="2"/><text x="1048" y="641" font-size="19" fill="#13243a" font-weight="700">Gold 마트</text><text x="1048" y="669" font-size="15" fill="#45566c">KPI · 리포트</text>
