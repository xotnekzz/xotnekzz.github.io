<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">AS-IS · DAG마다 독립적으로 실행되는 Cron 파이프라인</title><desc id="desc">각 DAG가 Cron 시각에 독립 실행되어 데이터 누락 시 운영자가 연관 DAG를 개별 재실행합니다.</desc>
