<rect x="30" y="358" width="1020" height="87" rx="10" fill="#ffebee" stroke="#c62828"/>
<text x="540" y="390" class="label">데이터 누락 발생 → 영향받는 DAG 확인 → 각 DAG를 수동 재실행</text>
<text x="540" y="421" class="sub">화살표는 데이터 의존 관계 · 각 DAG의 실행은 독립적인 Cron이 결정</text>
