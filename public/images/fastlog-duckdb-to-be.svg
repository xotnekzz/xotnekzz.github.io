<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="450" viewBox="0 0 1320 450" role="img" aria-labelledby="title desc"><title id="title">TO-BE · gzip 원본과 DuckDB 배치 ETL</title><desc id="desc">TO-BE · gzip 원본과 DuckDB 배치 ETL. 왼쪽부터 수집, 전송 및 저장, 변환, 분석 연계 순서.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28253d"/></marker><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#28253d}.title{font-size:27px;font-weight:700}.label{font-size:20px;font-weight:600;text-anchor:middle}.sub{font-size:17px;text-anchor:middle}</style></defs><rect width="1320" height="450" fill="#fff"/>
<text x="30" y="45" class="title">TO-BE · gzip 원본과 DuckDB 배치 ETL</text>
<rect x="30" y="82" width="285" height="240" rx="12" fill="#f9f9fb" stroke="#28253d"/><text x="172.5" y="117" class="label">[1] 로그 수집 · 배치 경계</text>
<rect x="42" y="153" width="261" height="140" rx="10" fill="#e3f2fd" stroke="#1565c0"/><text x="172.5" y="191" class="label">Nginx → Logrotate</text><text x="172.5" y="231" class="sub">1시간 단위 rotate + gzip</text><text x="172.5" y="263" class="sub">로그 서버에서 압축</text>
<path d="M316 223H353" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="355" y="82" width="285" height="240" rx="12" fill="#f9f9fb" stroke="#28253d"/><text x="497.5" y="117" class="label">[2] 전송 · 원본 저장</text>
<path d="M367 166 A130.5 13 0 0 1 628 166 V280 A130.5 13 0 0 1 367 280 Z" fill="#e8f5e9" stroke="#2e7d32"/><ellipse cx="497.5" cy="166" rx="130.5" ry="13" fill="#e8f5e9" stroke="#2e7d32"/><text x="497.5" y="204" class="label">SeaweedFS Filer</text><text x="497.5" y="231" class="sub">gzip 원본 로그 보관</text><text x="497.5" y="263" class="sub">압축 상태로 전송</text>
<path d="M641 223H678" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="82" width="285" height="240" rx="12" fill="#f9f9fb" stroke="#28253d"/><text x="822.5" y="117" class="label">[3] 변환 · 분석 데이터</text>
<rect x="692" y="153" width="261" height="140" rx="10" fill="#e3f2fd" stroke="#1565c0"/><text x="822.5" y="191" class="label">Docker · DuckDB</text><text x="822.5" y="231" class="sub">파싱 · 정규화 · GeoIP</text><text x="822.5" y="263" class="sub">Parquet (ZSTD) → SeaweedFS</text>
<path d="M966 223H1003" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1005" y="82" width="285" height="240" rx="12" fill="#f9f9fb" stroke="#28253d"/><text x="1147.5" y="117" class="label">[4] 분석 연계</text>
<rect x="1017" y="153" width="261" height="140" rx="10" fill="#e3f2fd" stroke="#1565c0"/><text x="1147.5" y="191" class="label">Airflow → 하위 DAG</text><text x="1147.5" y="231" class="sub">실제 출력 파티션 목록 전달</text><text x="1147.5" y="263" class="sub">Asset 이벤트 → 후속 적재</text>
<rect x="30" y="350" width="1260" height="78" rx="10" fill="#e8f5e9"/><text x="660" y="380" class="label">Airflow DockerOperator가 배치 ETL 실행 · 컨테이너는 실제 저장한 파티션을 반환</text><text x="660" y="411" class="sub">gzip은 원본 보관용 · Parquet는 분석·적재용 · 이벤트 발행과 후속 적재는 외부 DAG 책임</text></svg>